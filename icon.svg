  <rect width="128" height="128" rx="16" fill="#4CAF50"/>
  <!-- Hay bale -->
  <ellipse cx="64" cy="80" rx="24" ry="18" fill="#F9A825"/>
  <ellipse cx="64" cy="78" rx="22" ry="16" fill="#FDD835"/>
  <!-- Tractor body -->
  <rect x="36" y="44" width="56" height="30" rx="6" fill="#388E3C"/>
  <!-- Tractor cab -->
  <rect x="68" y="30" width="28" height="22" rx="4" fill="#2E7D32"/>
  <!-- Wheels -->
  <circle cx="46" cy="76" r="14" fill="#1B5E20"/>
  <circle cx="46" cy="76" r="8"  fill="#33691E"/>
  <circle cx="88" cy="72" r="10" fill="#1B5E20"/>
  <circle cx="88" cy="72" r="6"  fill="#33691E"/>
  <!-- Stars -->
  <text x="8" y="24" font-size="20">⭐</text>
  <text x="95" y="24" font-size="20">🌙</text>
